# XcodeGen spec for the native iOS app. Generate the Xcode project with:
#   brew install xcodegen && cd ios && xcodegen
# then open Mien.xcodeproj, pick your Team under Signing & Capabilities, and run on your iPhone.
name: Mien
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  EmotionEngine:
    path: EmotionEngine
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Mien:
    type: application
    platform: iOS
    sources:
      - path: Mien
    dependencies:
      - package: EmotionEngine
    info:
      path: Mien/Info.plist
      properties:
        CFBundleDisplayName: Mien
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: Mien reads your facial expressions on this iPhone using the front TrueDepth camera. Nothing is recorded or uploaded.
        UILaunchScreen:
          UIColorName: ""
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.mien
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_PREVIEWS: YES
schemes:
  Mien:
    build:
      targets:
        Mien: all
    run:
      config: Debug
    archive:
      config: Release
