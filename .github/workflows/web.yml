name: Web app

on:
  push:
    paths: ["web/**", "model/**", "ios/EmotionEngine/Sources/EmotionEngine/Resources/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "model/**", "ios/EmotionEngine/Sources/EmotionEngine/Resources/**", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Model format, iOS model copy, typecheck, unit + golden tests
        run: npm run check
      - name: Build (downloads the MediaPipe face model)
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Face video for end-to-end tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null
          curl -sSfL -o "$RUNNER_TEMP/clip.mp4" https://raw.githubusercontent.com/cosanlab/py-feat/main/feat/tests/data/WolfgangLanger_Pexels.mp4
          ffmpeg -loglevel error -i "$RUNNER_TEMP/clip.mp4" -pix_fmt yuv420p "$RUNNER_TEMP/clip.y4m"
      - name: End-to-end tests (Chromium, fake camera fed with the face video)
        run: npx playwright test
        env:
          FAKE_VIDEO: ${{ runner.temp }}/clip.y4m
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: web/test-results
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: test
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check that GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GitHub Pages is not enabled. In the repository go to Settings > Pages and set Source to 'GitHub Actions', then re-run this workflow."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - id: deployment
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
